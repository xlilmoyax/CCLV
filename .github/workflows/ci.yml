name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, devel ]
  pull_request:
    branches: [ main, master, devel ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Build Application
      run: npm run build
      env:
        NODE_ENV: production
